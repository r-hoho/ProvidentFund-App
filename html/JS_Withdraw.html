<script>
  // ==========================================
  // WITHDRAWAL LOGIC
  // ==========================================

  function openWithdraw() {
    if (!globalUserProfile) return;

    const tenureY = globalUserProfile.tenureY || 0;
    const tenureM = globalUserProfile.tenureM || 0;
    
    document.getElementById('withdrawTenureText').textContent = `${tenureY} ปี (Years) ${tenureM} เดือน (Months)`;

    // Own contributions are always fully eligible — static green row.
    const ownStatus = document.getElementById('withdrawOwnStatus');
    ownStatus.style.color = '#16a34a';

    // 5-Year Vesting Logic Check (employer match only)
    const matchStatus = document.getElementById('withdrawMatchStatus');
    const matchVerdict = document.getElementById('withdrawMatchVerdict');
    if (tenureY < 5) {
      matchStatus.style.color = '#dc2626';
      matchVerdict.innerHTML = '❌ ไม่ได้รับ — ต้องเป็นสมาชิกครบ 5 ปี<br><small>(Not eligible — requires 5 years membership)</small>';
    } else {
      matchStatus.style.color = '#16a34a';
      matchVerdict.innerHTML = '✅ ได้รับเต็มจำนวน<br><small>(Fully eligible)</small>';
    }

    // Reset safety checkbox and disable button
    document.getElementById('withdrawConfirmCheck').checked = false;
    document.getElementById('submitWithdrawBtn').disabled = true;

    document.getElementById('withdrawEffectiveBanner').innerHTML = effectiveDateBannerHTML('withdraw');
    document.getElementById('withdrawModal').showModal();
  }

  function closeWithdraw() {
    document.getElementById('withdrawModal').close();
  }

  function toggleWithdrawSubmit() {
    const isChecked = document.getElementById('withdrawConfirmCheck').checked;
    document.getElementById('submitWithdrawBtn').disabled = !isChecked;
  }

  function submitWithdrawal() {
    const btn = document.getElementById('submitWithdrawBtn');
    btn.setAttribute('aria-busy', 'true'); 
    btn.textContent = " กำลังดำเนินการ..."; 
    btn.disabled = true; 
    
    google.script.run
      .withSuccessHandler((response) => {
        btn.removeAttribute('aria-busy'); 
        btn.textContent = "ยืนยัน / Confirm"; 

        if (response && response.success) { 
          closeWithdraw(); 
          showSuccessToast("ลาออกสำเร็จ! / Withdrawal Successful!"); 
        } else { 
          btn.disabled = false;
          alert("Error: " + (response ? response.msg : "Unknown error")); 
        }
      })
      .withFailureHandler((err) => { 
        btn.removeAttribute('aria-busy'); 
        btn.textContent = "ยืนยัน / Confirm"; 
        btn.disabled = false; 
        alert("System Error: " + err); 
      })
      .processWithdrawal(navigator.userAgent);
  }
</script>
