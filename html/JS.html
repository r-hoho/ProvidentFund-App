<script>
  document.addEventListener("DOMContentLoaded", () => {
    google.script.run.withSuccessHandler(populateUI).withFailureHandler((err) => showError("System Error: " + err)).getUserProfile();
    google.script.run.withSuccessHandler(applyCooldownUI).checkPlanChangeEligibility();
  });

  function applyCooldownUI(status) {
    const changeBtn = document.getElementById('mainChangePlanBtn');
    const messageDiv = document.getElementById('cooldownMessage');
    
    if (status.locked) {
      changeBtn.disabled = true; changeBtn.className = "secondary"; 
      messageDiv.innerHTML = `🔒 ไม่สามารถเปลี่ยนอัตราได้ (Locked).<br>เปลี่ยนได้อีกครั้งวันที่: <strong>${status.nextDate}</strong>`;
      messageDiv.style.display = "block";
    } else {
      changeBtn.disabled = false; changeBtn.className = ""; 
      if (messageDiv.innerHTML.includes("Locked")) messageDiv.style.display = "none";
    }
  }

  function showSuccessToast(message) {
    const toast = document.getElementById("successToast");
    toast.innerHTML = `<strong style="color: white !important;">${message}</strong>`; 
    toast.style.visibility = "visible"; toast.style.opacity = "1"; toast.style.bottom = "50px";
    
    setTimeout(() => {
      toast.style.opacity = "0"; toast.style.bottom = "30px";
      setTimeout(() => {
        toast.style.visibility = "hidden";
        document.getElementById('dashboardContent').style.display = 'none';
        document.getElementById('loadingState').style.display = 'block'; 
        google.script.run.withSuccessHandler(populateUI).getUserProfile();
        google.script.run.withSuccessHandler(applyCooldownUI).checkPlanChangeEligibility();
      }, 400); 
    }, 1500); 
  }

  function populateUI(response) {
    document.getElementById('loadingState').style.display = 'none';
    if (response && response.success) {
      document.getElementById('dashboardContent').style.display = 'block';

      document.getElementById('empName').textContent = response.name || "-";
      document.getElementById('empId').textContent = response.allstarsId || response.title || "-"; 
      const d = new Date(response.hireDate);
      document.getElementById('empHireDate').textContent = isNaN(d) ? "-" : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const statusPill = document.getElementById('statusPill');
      const enrolledInfoGroup = document.getElementById('enrolledInfoGroup');
      const enrollBtn = document.getElementById('mainEnrollBtn');
      const changePlanBtn = document.getElementById('mainChangePlanBtn');
      const withdrawBtn = document.getElementById('mainWithdrawBtn');
      const messageDiv = document.getElementById('cooldownMessage'); 

      enrollBtn.style.display = 'none'; changePlanBtn.style.display = 'none'; withdrawBtn.style.display = 'none';
      enrolledInfoGroup.style.display = 'none'; messageDiv.style.display = 'none'; messageDiv.innerHTML = '';

      if (response.enrollment.withdrawalCount >= 2) {
        statusPill.innerHTML = "หมดสิทธิ์ถาวร / Locked"; statusPill.style.color = "var(--pico-del-color)";
      } else if (response.isOnProbation) {
        statusPill.innerHTML = "ทดลองงาน / Probation"; statusPill.style.color = "#ffb74d"; 
        if (response.probationEndDate) {
          const probDate = new Date(response.probationEndDate);
          messageDiv.innerHTML = `* สามารถสมัครได้เมื่อผ่านทดลองงาน / Eligible to enroll after:<br><strong>${probDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</strong>`;
          messageDiv.style.display = 'block';
        }
      } else if (response.isCoolingDown) {
        statusPill.innerHTML = "ระงับสิทธิ์ชั่วคราว / Cooldown"; statusPill.style.color = "#ba68c8"; 
        const unlockDate = new Date(response.cooldownEndDate);
        messageDiv.innerHTML = `* สามารถสมัครใหม่ได้ในวันที่ / Eligible to re-enroll on:<br><strong>${unlockDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</strong>`;
        messageDiv.style.display = 'block';
      } else if (response.enrollment.isEnrolled) {
        statusPill.innerHTML = `เป็นสมาชิก / Enrolled`; statusPill.style.color = "#2e7d32"; 
        enrolledInfoGroup.style.display = 'block'; 
        let memberSinceStr = "-";
        if (response.enrollment.enrolledDate) {
          const enrollDateObj = new Date(response.enrollment.enrolledDate);
          memberSinceStr = enrollDateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        document.getElementById('infoPlan').textContent = `${(response.enrollment.currentPlan * 100).toFixed(0)}%`;
        document.getElementById('infoMatch').textContent = response.matchPercent || "-";
        document.getElementById('infoSince').textContent = memberSinceStr;
        changePlanBtn.style.display = 'block'; withdrawBtn.style.display = 'block';
      } else {
        statusPill.innerHTML = "ยังไม่เข้าร่วม / Not Enrolled"; statusPill.style.color = "var(--pico-color)";
        enrollBtn.style.display = 'block';
      }
    } else {
      showError(response ? response.msg : "Data transfer error.");
    }
  }

  function showError(message) {
    document.getElementById('loadingState').style.display = 'none'; document.getElementById('dashboardContent').style.display = 'none'; 
    const errorBox = document.getElementById('errorState'); document.getElementById('errorDetails').textContent = message; errorBox.style.display = 'block';
  }

  // ==========================================
  // NEW FULL-SCREEN WIZARD LOGIC
  // ==========================================
  let wizData = { contribution: null, investment: null, beneficiaries: [{ name: '', rel: '', pct: 100 }] };
  let currentStep = 1;

  function openEnroll() {
    wizData = { contribution: null, investment: null, beneficiaries: [{ name: '', rel: '', pct: 100 }] };
    currentStep = 1;
    document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('enrollWizard').style.display = 'flex';
    document.body.style.overflow = 'hidden'; 
    updateWizardUI();
  }

  function closeWizard() { document.getElementById('enrollWizard').style.display = 'none'; document.body.style.overflow = ''; }

  function selectContribution(val) {
    wizData.contribution = val;
    document.querySelectorAll('#wizStep1 .option-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('card-c-' + val).classList.add('selected');
    validateStep();
  }

  function selectInvestment(val) {
    wizData.investment = val;
    document.querySelectorAll('#wizStep2 .option-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('card-i-' + val).classList.add('selected');
    validateStep();
  }

  function addBeneficiary() {
    if (wizData.beneficiaries.length < 4) {
      wizData.beneficiaries.push({ name: '', rel: '', pct: 0 });
      renderBeneficiaries(); validateStep();
    }
  }

  function removeBeneficiary(index) {
    wizData.beneficiaries.splice(index, 1);
    renderBeneficiaries(); validateStep();
  }

  function updateBenData(index, field, value) {
    wizData.beneficiaries[index][field] = value;
    validateStep();
  }

  const relOptions = `
    <option value="" disabled selected>เลือก...</option>
    <option value="Parent">บิดา/มารดา (Parent)</option>
    <option value="Spouse">คู่สมรส (Spouse)</option>
    <option value="Child">บุตร (Child)</option>
    <option value="Relative">ญาติ (Relative)</option>
    <option value="Friend">เพื่อน (Friend)</option>
    <option value="Other">อื่นๆ (Other)</option>
  `;

  function renderBeneficiaries() {
    const list = document.getElementById('beneficiaryList'); list.innerHTML = '';
    wizData.beneficiaries.forEach((ben, index) => {
      const card = document.createElement('div'); card.className = 'ben-card';
      let removeBtn = index > 0 ? `<button class="ben-remove" onclick="removeBeneficiary(${index})">❌ ลบ</button>` : '';
      card.innerHTML = `
        ${removeBtn}
        <label style="font-size:0.85rem; color:var(--pico-muted-color);">ชื่อ-สกุล (Name)</label>
        <input type="text" value="${ben.name}" oninput="updateBenData(${index}, 'name', this.value)" placeholder="e.g., John Doe" style="margin-bottom:0.75rem;" required>
        <div class="grid" style="grid-template-columns: 2fr 1fr; gap:0.5rem;">
          <div>
            <label style="font-size:0.85rem; color:var(--pico-muted-color);">ความสัมพันธ์ (Rel.)</label>
            <select onchange="updateBenData(${index}, 'rel', this.value)" style="margin-bottom:0;" required>
              ${relOptions.replace(`value="${ben.rel}"`, `value="${ben.rel}" selected`)}
            </select>
          </div>
          <div>
            <label style="font-size:0.85rem; color:var(--pico-muted-color);">สัดส่วน (%)</label>
            <input type="number" min="1" max="100" value="${ben.pct}" oninput="updateBenData(${index}, 'pct', this.value)" style="margin-bottom:0;" required>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
    document.getElementById('addBenBtn').style.display = wizData.beneficiaries.length >= 4 ? 'none' : 'block';
  }

  function updateWizardUI() {
    document.getElementById('wizardStepTitle').textContent = `Step ${currentStep} of 4`;
    for (let i = 1; i <= 4; i++) { document.getElementById(`wizStep${i}`).style.display = (i === currentStep) ? 'block' : 'none'; }
    document.getElementById('wizBackBtn').style.visibility = (currentStep === 1) ? 'hidden' : 'visible';
    
    const nextBtn = document.getElementById('wizNextBtn');
    if (currentStep === 4) { nextBtn.textContent = "ยืนยันการสมัคร / Submit"; nextBtn.classList.remove('secondary'); } 
    else { nextBtn.textContent = "ถัดไป / Next"; nextBtn.classList.add('secondary'); } // Keep blue only on summary

    if (currentStep === 3) renderBeneficiaries();
    if (currentStep === 4) renderSummary();
    validateStep();
  }

  function validateStep() {
    const nextBtn = document.getElementById('wizNextBtn');
    let isValid = false;

    if (currentStep === 1) { isValid = wizData.contribution !== null; } 
    else if (currentStep === 2) { isValid = wizData.investment !== null; } 
    else if (currentStep === 3) {
      let totalPct = 0; let allFilled = true;
      wizData.beneficiaries.forEach(b => {
        totalPct += parseInt(b.pct) || 0;
        if (!b.name.trim() || !b.rel) allFilled = false;
      });
      const totalMsg = document.getElementById('benTotalText');
      const helperMsg = document.getElementById('benHelperText');
      totalMsg.textContent = `${totalPct}%`;
      
      if (totalPct === 100) { 
        totalMsg.style.color = "#2e7d32"; 
        isValid = allFilled; 
        if (helperMsg) helperMsg.style.display = 'none';
      } else { 
        totalMsg.style.color = "var(--pico-del-color)"; 
        isValid = false; 
        if (helperMsg) {
          helperMsg.style.display = 'block';
          if (totalPct > 100) {
            helperMsg.textContent = "สัดส่วนเกิน 100% (Total exceeds 100%)";
          } else {
            helperMsg.textContent = "กรุณาระบุสัดส่วนให้ครบ 100% (Must equal exactly 100%)";
          }
        }
      }
    } 
    else if (currentStep === 4) { isValid = true; }

    nextBtn.disabled = !isValid;
    if(isValid) nextBtn.classList.remove('secondary'); else nextBtn.classList.add('secondary');
  }

  function wizardNext() { if (currentStep < 4) { currentStep++; updateWizardUI(); } else { submitEnrollWizard(); } }
  function wizardBack() { if (currentStep > 1) { currentStep--; updateWizardUI(); } }

  function renderSummary() {
    document.getElementById('sumContrib').textContent = `${(parseFloat(wizData.contribution) * 100).toFixed(0)}%`;
    document.getElementById('sumInvest').textContent = wizData.investment;
    let benHtml = `<ul style="margin-top:0.5rem; padding-left:1.25rem;">`;
    wizData.beneficiaries.forEach(b => { benHtml += `<li style="font-weight:normal;">${b.name} (${b.rel}) - <strong style="color:var(--pico-primary);">${b.pct}%</strong></li>`; });
    benHtml += `</ul>`;
    document.getElementById('sumBens').innerHTML = benHtml;
  }

  function submitEnrollWizard() {
    const btn = document.getElementById('wizNextBtn');
    btn.setAttribute('aria-busy', 'true'); btn.textContent = " กำลังบันทึก..."; btn.disabled = true; 
    document.getElementById('wizBackBtn').disabled = true;

    const deviceData = navigator.userAgent;
    const payload = { contributionPlan: parseFloat(wizData.contribution), investmentPlan: wizData.investment, beneficiariesJSON: JSON.stringify(wizData.beneficiaries) };

    google.script.run
      .withSuccessHandler((response) => {
        btn.removeAttribute('aria-busy'); btn.disabled = false; document.getElementById('wizBackBtn').disabled = false;
        if (response && response.success) { closeWizard(); showSuccessToast("สมัครสมาชิกสำเร็จ! / Enrollment Successful!"); } 
        else { alert("Error: " + (response ? response.msg : "Unknown error")); }
      })
      .withFailureHandler((err) => {
        btn.removeAttribute('aria-busy'); btn.disabled = false; document.getElementById('wizBackBtn').disabled = false; alert("System Error: " + err);
      })
      .processEnrollment(payload, deviceData);
  }

  // --- CHANGE PLAN FLOW ---
  function openChangePlan() { document.getElementById('changePlanModal').showModal(); }
  function closeChangePlan() { document.getElementById('newPlan').value = ""; document.getElementById('changePlanModal').close(); }
  function submitChangePlan() {
    const planSelect = document.getElementById('newPlan'); const selectedPlan = planSelect.value;
    if (!selectedPlan) { alert("กรุณาเลือกอัตราเงินสะสมใหม่ / Please select a new plan."); return; }
    const btn = document.getElementById('submitChangeBtn');
    btn.setAttribute('aria-busy', 'true'); btn.textContent = " กำลังบันทึก..."; btn.disabled = true; planSelect.disabled = true;
    const deviceData = navigator.userAgent;

    google.script.run
      .withSuccessHandler((response) => {
        btn.removeAttribute('aria-busy'); btn.textContent = "ยืนยัน / Confirm"; btn.disabled = false; planSelect.disabled = false;
        if (response && response.success) { closeChangePlan(); showSuccessToast("เปลี่ยนอัตราสำเร็จ! / Plan Changed Successfully!"); } 
        else { alert("Error: " + (response ? response.msg : "Unknown error")); }
      })
      .withFailureHandler((err) => { btn.removeAttribute('aria-busy'); btn.textContent = "ยืนยัน / Confirm"; btn.disabled = false; planSelect.disabled = false; alert("System Error: " + err); })
      .processChangePlan(parseFloat(selectedPlan), deviceData);
  }

  function openWithdraw() { alert("Withdraw flow coming soon!"); }
  function sendReport() { /* Unchanged */ }
</script>
