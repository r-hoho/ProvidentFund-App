<script>

  let globalEnrollmentData = null;
  let globalUserProfile = null;
  let planChangeStatus = { locked: false };

  document.addEventListener("DOMContentLoaded", () => {
    google.script.run.withSuccessHandler(populateUI).withFailureHandler((err) => showError("System Error: " + err)).getUserProfile();
    google.script.run.withSuccessHandler(applyCooldownUI).checkPlanChangeEligibility();
    // GA4 "app_open" — fired here (not server-side in doGet) so it can carry the
    // device. DOMContentLoaded fires once per real page load; the post-action
    // home-reload is a soft re-render (see showSuccessToast), so this won't
    // re-fire and inflate visit counts. Best-effort — no handlers needed.
    google.script.run.trackAppOpen(navigator.userAgent + ' | ' + screen.width + 'x' + screen.height);
  });

  function applyCooldownUI(status) {
    planChangeStatus = status || { locked: false };
  }

  // Set by an action's success handler; consumed by populateUI after the forced
  // home-reload so the post-action feedback prompt lands on the home screen.
  let pendingFeedbackAction = null;

  function showSuccessToast(message) {
    const toast = document.getElementById("successToast");
    toast.innerHTML = `<strong style="color: white !important;">${message}</strong>`;
    toast.style.visibility = "visible"; toast.style.opacity = "1"; toast.style.bottom = "50px";

    setTimeout(() => {
      toast.style.opacity = "0"; toast.style.bottom = "30px";
      setTimeout(() => {
        toast.style.visibility = "hidden";
        document.getElementById('dashboardContent').style.display = 'none';
        document.getElementById('loadingState').style.display = 'block';
        google.script.run.withSuccessHandler(populateUI).getUserProfile();
        google.script.run.withSuccessHandler(applyCooldownUI).checkPlanChangeEligibility();
      }, 400);
    }, 1500);
  }

  function populateUI(response) {
    document.getElementById('loadingState').style.display = 'none';
    if (response && response.success) {
      globalEnrollmentData = response.enrollment;
      globalUserProfile = response; 
      document.getElementById('dashboardContent').style.display = 'block';

      // NEW: Render Pending Transactions
      const pendingBox = document.getElementById('pendingTxBox');
      const pendingList = document.getElementById('pendingTxList');
      pendingList.innerHTML = '';
      if (response.pendingTransactions && response.pendingTransactions.length > 0) {
        response.pendingTransactions.forEach(tx => {
          const submitted = new Date(tx.submittedAt);
          const editable = new Date(tx.editableUntil);

          const submittedStr = submitted.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          const editableStr = editable.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

          // Dynamically build bilingual description
          let description = "";
          if (tx.type === "Enroll") {
            const planPct = (tx.currentValues.Current_Plan * 100).toFixed(0);
            description = `สมัครสมาชิกแผน ${planPct}% <span class="muted">/ Enrollment to ${planPct}% plan</span>`;
          } else if (tx.type === "Change Plan") {
            const planPct = (tx.currentValues.Current_Plan * 100).toFixed(0);
            description = `เปลี่ยนแผนเป็น ${planPct}% <span class="muted">/ Plan change to ${planPct}%</span>`;
          } else if (tx.type === "Withdraw") {
            description = `ลาออกจากกองทุน <span class="muted">/ Withdrawal from fund</span>`;
          }

          const item = document.createElement('div');
          item.style = "border-bottom: 1px solid var(--pico-muted-border-color); padding-bottom: 1rem; margin-bottom: 1rem;";
          item.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;">
              <div style="flex:1; min-width:0;">
                <h6 style="margin-bottom: 0.5rem;"><strong>${description}</strong></h6>
                <div style="font-size: 0.85rem; color: var(--pico-muted-color);">
                  <div><span class="muted">ส่งเมื่อ / </span>Submitted: ${submittedStr}</div>
                  <div><span class="muted">ยกเลิกได้ถึง / </span>Cancellable until: ${editableStr}</div>
                </div>
              </div>
              <button class="outline secondary" style="margin:0; padding:0.4rem 0.9rem; font-size:0.85rem; white-space:nowrap; line-height:1.15;" onclick="openCancelTx('${tx.transactionId}', '${tx.type}')">
                ยกเลิก<br>Cancel
              </button>
            </div>
          `;
          pendingList.appendChild(item);
        });
        // Remove border from last item
        if (pendingList.lastChild) {
          pendingList.lastChild.style.borderBottom = 'none';
          pendingList.lastChild.style.marginBottom = '0';
        }
        pendingBox.style.display = 'block';
      } else {
        pendingBox.style.display = 'none';
      }

      document.getElementById('empName').textContent = response.name || "-";
      document.getElementById('empId').textContent = response.allstarsId || response.title || "-"; 
      const d = new Date(response.hireDate);
      document.getElementById('empHireDate').textContent = isNaN(d) ? "-" : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const statusPill = document.getElementById('statusPill');
      const enrolledInfoGroup = document.getElementById('enrolledInfoGroup');
      const enrollBtn = document.getElementById('mainEnrollBtn');
      const messageDiv = document.getElementById('cooldownMessage');

      enrollBtn.style.display = 'none'; 
      enrolledActionsGroup.style.display = 'none'; // <-- NEW
      enrolledInfoGroup.style.display = 'none'; 
      messageDiv.style.display = 'none'; messageDiv.innerHTML = '';

      if (response.enrollment.withdrawalCount >= 3) {
        statusPill.innerHTML = "หมดสิทธิ์ถาวร / Locked"; statusPill.style.setProperty('color', 'var(--pico-del-color)', 'important');
        showWithdrawalMessage(response);
      } else if (response.isOnProbation) {
        statusPill.innerHTML = "ระหว่างทดลองงาน / Probation"; statusPill.style.setProperty('color', '#ffb74d', 'important');
        if (response.probationEndDate) {
          const probDate = new Date(response.probationEndDate);
          messageDiv.innerHTML = `* สามารถสมัครได้เมื่อผ่านทดลองงาน<br>Eligible to enroll after:<br><strong>${probDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</strong>`;
          messageDiv.style.display = 'block';
        }
      } else if (response.isCoolingDown) {
        statusPill.innerHTML = "ระงับสิทธิ์ชั่วคราว / Cooldown"; statusPill.style.setProperty('color', '#ba68c8', 'important');
        showWithdrawalMessage(response);
      } 
      
      
      else if (response.enrollment.isEnrolled) {
        const pendingEnroll = response.pendingTransactions && response.pendingTransactions.some(tx => tx.type === 'Enroll');
        if (pendingEnroll) {
          statusPill.innerHTML = '—';
          statusPill.style.setProperty('color', 'var(--pico-muted-color)', 'important');
        } else {
          const enrolledAttempt = (response.enrollment.withdrawalCount || 0) + 1;
          statusPill.innerHTML = `เป็นสมาชิก ครั้งที่ ${enrolledAttempt} / Enrolled #${enrolledAttempt}`;
          statusPill.style.setProperty('color', '#2e7d32', 'important');
        }
        enrolledInfoGroup.style.display = 'block';
        let memberSinceStr = "-";
        if (response.memberSinceDate) {
          const sinceDate = new Date(response.memberSinceDate);
          const day = String(sinceDate.getDate()).padStart(2, '0');
          const mon = sinceDate.toLocaleDateString('en-GB', { month: 'short' });
          const yr2 = String(sinceDate.getFullYear()).slice(-2);
          const dateStr = `${day}-${mon}-${yr2}`;
          const durParts = [];
          if (response.tenureY > 0) durParts.push(`${response.tenureY}y`);
          if (response.tenureM > 0 || response.tenureY === 0) durParts.push(`${response.tenureM}m`);
          memberSinceStr = `${dateStr}  ·  ${durParts.join(' ')}`;
        }
        const hasPending = response.pendingTransactions && response.pendingTransactions.length > 0;
        document.getElementById('infoPlan').textContent = hasPending ? '—' : `${(response.enrollment.currentPlan * 100).toFixed(0)}%`;
        document.getElementById('infoMatch').textContent = response.matchPercent || "-";
        document.getElementById('infoSince').textContent = memberSinceStr;
        enrolledActionsGroup.style.display = 'block'; // <-- Show the new 2x2 grid
      } else {
        const enrollAttempt = (response.enrollment.withdrawalCount || 0) + 1;
        statusPill.innerHTML = `มีสิทธิ์สมัครได้ ครั้งที่ ${enrollAttempt} / Eligible #${enrollAttempt}`; statusPill.style.setProperty('color', 'var(--pico-color)', 'important');
        enrollBtn.style.display = 'block';
      }

      // After a successful action + forced home reload, surface the rating prompt.
      if (pendingFeedbackAction) {
        const a = pendingFeedbackAction; pendingFeedbackAction = null;
        setTimeout(() => openFeedback(a), 300);
      }
    } else {
      showError(response ? response.msg : "Data transfer error.");
    }
  }

  function showError(message) {
    document.getElementById('loadingState').style.display = 'none'; document.getElementById('dashboardContent').style.display = 'none'; 
    const errorBox = document.getElementById('errorState'); document.getElementById('errorDetails').textContent = message; errorBox.style.display = 'block';
  }

  // ==========================================
  // NEW FULL-SCREEN WIZARD LOGIC
  // ==========================================
  let wizData = { contribution: null, investment: null, beneficiaries: [{ prefix: '', name: '', rel: '', pct: 100, address: '' }] };
  let currentStep = 1;
  let wizSigHandle = null; // signature pad instance for step 5

  function openEnroll() {
    wizData = { contribution: null, investment: null, beneficiaries: [{ prefix: '', name: '', rel: '', pct: 100, address: '' }] };
    currentStep = 1;
    if (wizSigHandle) { PFSignature.destroy(wizSigHandle); wizSigHandle = null; }
    document.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('enrollWizard').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    updateWizardUI();
  }

  function closeWizard() {
    if (wizSigHandle) { PFSignature.destroy(wizSigHandle); wizSigHandle = null; }
    document.getElementById('enrollWizard').style.display = 'none';
    document.body.style.overflow = '';
  }

  // Mounts a fresh signature pad on entering step 5; re-validates on each stroke
  // so the Submit button enables as soon as anything is drawn.
  function mountWizSignature() {
    const canvas = document.getElementById('wizSigCanvas');
    if (wizSigHandle) PFSignature.destroy(wizSigHandle);
    wizSigHandle = PFSignature.mount(canvas, validateStep);
    validateStep();
  }
  function clearWizSignature() { PFSignature.clear(wizSigHandle); validateStep(); }

  function selectContribution(val) {
    wizData.contribution = val;
    document.querySelectorAll('#wizStep1 .option-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('card-c-' + val).classList.add('selected');
    validateStep();
  }

  function selectInvestment(val) {
    wizData.investment = val;
    document.querySelectorAll('#wizStep2 .option-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('card-i-' + val).classList.add('selected');
    validateStep();
  }

  function addBeneficiary() {
    if (wizData.beneficiaries.length < 5) {
      wizData.beneficiaries.push({ prefix: '', name: '', rel: '', pct: 0, address: '' });
      renderBeneficiaries(); validateStep();
    }
  }

  function toggleSameAsAbove(index, checked) {
    if (index < 1) return;
    const val = checked ? (wizData.beneficiaries[index - 1].address || '') : '';
    wizData.beneficiaries[index].address = val;
    const ta = document.getElementById('benAddr-' + index);
    if (ta) ta.value = val;
    validateStep();
  }

  function removeBeneficiary(index) {
    wizData.beneficiaries.splice(index, 1);
    renderBeneficiaries(); validateStep();
  }

  function updateBenData(index, field, value) {
    wizData.beneficiaries[index][field] = value;
    validateStep();
  }

  const relOptions = `
    <option value="" disabled selected>เลือก...</option>
    <option value="Parent">บิดา/มารดา (Parent)</option>
    <option value="Spouse">คู่สมรส (Spouse)</option>
    <option value="Child">บุตร (Child)</option>
    <option value="Sibling">พี่น้อง (Sibling)</option>
    <option value="Relative">ญาติ (Relative)</option>
    <option value="Friend">เพื่อน (Friend)</option>
  `;

  // Name-prefix (title) options. Bank requirement: every beneficiary name carries a
  // title. The prefix is a transient UI-only field — it's merged into `name`
  // (via mergePrefixes) right before submission, so the stored JSON model stays
  // {name, rel, pct, address}. Shared by the wizard + the beneficiary manager.
  const prefixOptions = `
    <option value="" disabled selected>คำนำหน้า…</option>
    <optgroup label="ไทย">
      <option value="นาย">นาย</option>
      <option value="นาง">นาง</option>
      <option value="นางสาว">นางสาว</option>
      <option value="ด.ช.">ด.ช.</option>
      <option value="ด.ญ.">ด.ญ.</option>
    </optgroup>
    <optgroup label="English">
      <option value="Mr.">Mr.</option>
      <option value="Ms.">Ms.</option>
      <option value="Mrs.">Mrs.</option>
    </optgroup>
  `;
  const PREFIX_LIST = ['นาย', 'นาง', 'นางสาว', 'ด.ช.', 'ด.ญ.', 'Mr.', 'Ms.', 'Mrs.'];

  // Merge the transient prefix into `name` for storage: {prefix, name, ...} -> {name: "prefix name", ...}.
  function mergePrefixes(list) {
    return (list || []).map(b => ({
      name: ((b.prefix || '') + ' ' + (b.name || '')).trim(),
      rel: b.rel,
      pct: b.pct,
      address: b.address
    }));
  }

  // Inverse, used when re-editing a saved beneficiary: pull a known leading title
  // back out of `name` so the prefix dropdown is populated and we don't double-prefix.
  function splitPrefix(b) {
    const full = (b.name || '').trim();
    for (const p of PREFIX_LIST) {
      if (full.indexOf(p + ' ') === 0) {
        return Object.assign({}, b, { prefix: p, name: full.slice(p.length).trim() });
      }
    }
    return Object.assign({}, b, { prefix: b.prefix || '' });
  }

  function renderBeneficiaries() {
    const list = document.getElementById('beneficiaryList'); list.innerHTML = '';
    wizData.beneficiaries.forEach((ben, index) => {
      const card = document.createElement('div'); card.className = 'ben-card';
      let removeBtn = index > 0 ? `<button class="ben-remove" onclick="removeBeneficiary(${index})">❌ ลบ</button>` : '';
      card.innerHTML = `
        ${removeBtn}
        <label style="font-size:0.85rem; color:var(--pico-muted-color);">คำนำหน้า + ชื่อ-สกุล (Title + Name)</label>
        <div class="grid" style="grid-template-columns: 7rem 1fr; gap:0.5rem; margin-bottom:0.75rem;">
          <select onchange="updateBenData(${index}, 'prefix', this.value)" required>
            ${prefixOptions.replace(`value="${ben.prefix}"`, `value="${ben.prefix}" selected`)}
          </select>
          <input type="text" value="${ben.name}" oninput="updateBenData(${index}, 'name', this.value)" placeholder="e.g., John Doe" required>
        </div>
        <div class="grid" style="grid-template-columns: 2fr 1fr; gap:0.5rem;">
          <div>
            <label style="font-size:0.85rem; color:var(--pico-muted-color);">ความสัมพันธ์ (Rel.)</label>
            <select onchange="updateBenData(${index}, 'rel', this.value)" style="margin-bottom:0;" required>
              ${relOptions.replace(`value="${ben.rel}"`, `value="${ben.rel}" selected`)}
            </select>
          </div>
          <div>
            <label style="font-size:0.85rem; color:var(--pico-muted-color);">สัดส่วน (%)</label>
            <input type="number" min="1" max="100" value="${ben.pct}" oninput="updateBenData(${index}, 'pct', this.value)" style="margin-bottom:0;" required>
          </div>
        </div>
        <label style="font-size:0.85rem; color:var(--pico-muted-color); margin-top:0.75rem; display:block;">ที่อยู่ (Address)</label>
        ${index > 0 ? `<label style="font-size:0.8rem; color:var(--pico-muted-color); display:flex; align-items:center; gap:0.4rem; margin-bottom:0.4rem; font-weight:normal;"><input type="checkbox" onchange="toggleSameAsAbove(${index}, this.checked)" style="margin:0; width:1.15rem; height:1.15rem; flex-shrink:0;"> ที่อยู่เดียวกัน / Same as Above</label>` : ''}
        <textarea id="benAddr-${index}" oninput="updateBenData(${index}, 'address', this.value)" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์" rows="2" style="margin-bottom:0;" required>${ben.address || ''}</textarea>
      `;
      list.appendChild(card);
    });
    document.getElementById('addBenBtn').style.display = wizData.beneficiaries.length >= 5 ? 'none' : 'block';
  }

  function updateWizardUI() {
    document.getElementById('wizardStepTitle').textContent = `Step ${currentStep} of 5`;
    for (let i = 1; i <= 5; i++) { document.getElementById(`wizStep${i}`).style.display = (i === currentStep) ? 'block' : 'none'; }
    document.getElementById('wizBackBtn').style.visibility = (currentStep === 1) ? 'hidden' : 'visible';

    const nextBtn = document.getElementById('wizNextBtn');
    if (currentStep === 5) { nextBtn.textContent = "ยืนยันการสมัคร / Submit"; nextBtn.classList.remove('secondary'); }
    else { nextBtn.textContent = "ถัดไป / Next"; nextBtn.classList.add('secondary'); } // Keep blue only on submit

    if (currentStep === 3) renderBeneficiaries();
    if (currentStep === 4) renderSummary();
    if (currentStep === 5) mountWizSignature();
    validateStep();
  }

  function validateStep() {
    const nextBtn = document.getElementById('wizNextBtn');
    let isValid = false;

    if (currentStep === 1) { isValid = wizData.contribution !== null; } 
    else if (currentStep === 2) { isValid = wizData.investment !== null; } 
    else if (currentStep === 3) {
      let totalPct = 0; let allFilled = true;
      wizData.beneficiaries.forEach(b => {
        const pct = parseInt(b.pct) || 0;
        totalPct += pct;
        if (!b.prefix || !b.name.trim() || !b.rel || !(b.address || '').trim() || pct < 1) allFilled = false;
      });
      const totalMsg = document.getElementById('benTotalText');
      const helperMsg = document.getElementById('benHelperText');
      totalMsg.textContent = `${totalPct}%`;
      
      if (totalPct === 100) { 
        totalMsg.style.color = "#2e7d32"; 
        isValid = allFilled; 
        if (helperMsg) helperMsg.style.display = 'none';
      } else { 
        totalMsg.style.color = "var(--pico-del-color)"; 
        isValid = false; 
        if (helperMsg) {
          helperMsg.style.display = 'block';
          if (totalPct > 100) {
            helperMsg.textContent = "สัดส่วนเกิน 100% (Total exceeds 100%)";
          } else {
            helperMsg.textContent = "กรุณาระบุสัดส่วนให้ครบ 100% (Must equal exactly 100%)";
          }
        }
      }
    } 
    else if (currentStep === 4) { isValid = true; }
    else if (currentStep === 5) { isValid = !PFSignature.isEmpty(wizSigHandle); }

    nextBtn.disabled = !isValid;
    if(isValid) nextBtn.classList.remove('secondary'); else nextBtn.classList.add('secondary');
  }

  function wizardNext() { if (currentStep < 5) { currentStep++; updateWizardUI(); } else { submitEnrollWizard(); } }
  function wizardBack() { if (currentStep > 1) { currentStep--; updateWizardUI(); } }

  function renderSummary() {
    document.getElementById('sumContrib').textContent = `${(parseFloat(wizData.contribution) * 100).toFixed(0)}%`;
    document.getElementById('sumInvest').textContent = wizData.investment;
    let benHtml = `<ul style="margin-top:0.5rem; padding-left:1.25rem;">`;
    wizData.beneficiaries.forEach(b => { benHtml += `<li style="font-weight:normal;">${b.prefix ? b.prefix + ' ' : ''}${b.name} — ${relLabel(b.rel)} — <strong style="color:var(--pico-primary);">${b.pct}%</strong>${b.address ? `<br><small style="color:var(--pico-muted-color);">${b.address}</small>` : ''}</li>`; });
    benHtml += `</ul>`;
    document.getElementById('sumBens').innerHTML = benHtml;
    document.getElementById('sumEffectiveBanner').innerHTML = effectiveDateBannerHTML();
  }

  function submitEnrollWizard() {
    const btn = document.getElementById('wizNextBtn');
    btn.setAttribute('aria-busy', 'true'); btn.textContent = " กำลังบันทึก..."; btn.disabled = true; 
    document.getElementById('wizBackBtn').disabled = true;

    const deviceData = navigator.userAgent;
    const payload = {
      contributionPlan: parseFloat(wizData.contribution),
      investmentPlan: wizData.investment,
      beneficiariesJSON: JSON.stringify(mergePrefixes(wizData.beneficiaries)),
      sigDataUrl: PFSignature.getDataUrl(wizSigHandle)
    };

    google.script.run
      .withSuccessHandler((response) => {
        btn.removeAttribute('aria-busy'); btn.disabled = false; document.getElementById('wizBackBtn').disabled = false;
        if (response && response.success) { closeWizard(); pendingFeedbackAction = 'Enroll'; showSuccessToast("สมัครสมาชิกสำเร็จ! / Enrollment Successful!"); }
        else { alert("Error: " + (response ? response.msg : "Unknown error")); }
      })
      .withFailureHandler((err) => {
        btn.removeAttribute('aria-busy'); btn.disabled = false; document.getElementById('wizBackBtn').disabled = false; alert("System Error: " + err);
      })
      .processEnrollment(payload, deviceData);
  }

  // --- CHANGE PLAN FLOW ---
  function openChangePlan() {
    const isLocked = planChangeStatus.locked;
    document.getElementById('changePlanLocked').style.display   = isLocked ? 'block' : 'none';
    document.getElementById('changePlanSelector').style.display = isLocked ? 'none'  : 'block';
    document.getElementById('changePlanFooterLocked').style.display   = isLocked ? 'flex' : 'none';
    document.getElementById('changePlanFooterSelector').style.display = isLocked ? 'none' : 'flex';
    if (isLocked) {
      document.getElementById('changePlanNextDate').textContent = planChangeStatus.nextDate || '-';
    } else {
      const currentPlan = globalEnrollmentData ? parseFloat(globalEnrollmentData.currentPlan) : null;
      const currentPct = currentPlan ? `${(currentPlan * 100).toFixed(0)}%` : '-';
      document.getElementById('changePlanCurrentVal').textContent = currentPct;
      document.querySelectorAll('#newPlan option[value]:not([value=""])').forEach(opt => {
        const pct = `${(parseFloat(opt.value) * 100).toFixed(0)}%`;
        opt.textContent = parseFloat(opt.value) === currentPlan ? `${pct}  ·  ปัจจุบัน / Current` : pct;
      });
      const submitBtn = document.getElementById('submitChangeBtn');
      submitBtn.disabled = false;
      document.getElementById('newPlan').onchange = function() {
        submitBtn.disabled = currentPlan !== null && parseFloat(this.value) === currentPlan;
      };
    }
    if (!isLocked) document.getElementById('changePlanEffectiveBanner').innerHTML = effectiveDateBannerHTML();
    document.getElementById('changePlanModal').showModal();
  }
  function closeChangePlan() { document.getElementById('newPlan').value = ""; document.getElementById('changePlanModal').close(); }
  function submitChangePlan() {
    const planSelect = document.getElementById('newPlan'); const selectedPlan = planSelect.value;
    if (!selectedPlan) { alert("กรุณาเลือกอัตราเงินสะสมใหม่ / Please select a new plan."); return; }
    const btn = document.getElementById('submitChangeBtn');
    btn.setAttribute('aria-busy', 'true'); btn.textContent = " กำลังบันทึก..."; btn.disabled = true; planSelect.disabled = true;
    const deviceData = navigator.userAgent;

    google.script.run
      .withSuccessHandler((response) => {
        btn.removeAttribute('aria-busy'); btn.textContent = "ยืนยัน / Confirm"; btn.disabled = false; planSelect.disabled = false;
        if (response && response.success) { closeChangePlan(); pendingFeedbackAction = 'Change Plan'; showSuccessToast("เปลี่ยนอัตราสำเร็จ! / Plan Changed Successfully!"); }
        else { alert("Error: " + (response ? response.msg : "Unknown error")); }
      })
      .withFailureHandler((err) => { btn.removeAttribute('aria-busy'); btn.textContent = "ยืนยัน / Confirm"; btn.disabled = false; planSelect.disabled = false; alert("System Error: " + err); })
      .processChangePlan(parseFloat(selectedPlan), deviceData);
  }

  function sendReport() { /* Unchanged */ }
  function openChangeInvest() { document.getElementById('changeInvestModal').showModal(); }
  function closeChangeInvest() { document.getElementById('changeInvestModal').close(); }

  // ==========================================
  // CANCEL PENDING TRANSACTION
  // ==========================================
  function openCancelTx(txId, type) {
    document.getElementById('cancelTxId').value = txId;
    document.getElementById('cancelTxError').style.display = 'none';
    document.getElementById('cancelTxError').textContent = '';

    let typeLabel = '';
    let reassurance = '';
    if (type === 'Enroll') {
      typeLabel = 'การสมัครสมาชิก / Enrollment';
      reassurance = '<li>คุณจะกลับเป็นสถานะยังไม่เข้าร่วมกองทุน<br><small>You will return to Not Enrolled state</small></li>';
    } else if (type === 'Change Plan') {
      typeLabel = 'การเปลี่ยนแผน / Plan Change';
      reassurance = '<li>อัตราเงินสะสมเดิมจะถูกคืน<br><small>Your previous contribution % will be restored</small></li>'
                  + '<li>จะไม่ถูกล็อก 6 เดือน<br><small>No 6-month plan-change lock will be applied</small></li>';
    } else if (type === 'Withdraw') {
      typeLabel = 'การลาออกจากกองทุน / Withdrawal';
      reassurance = '<li>การลาออกจะไม่ถูกนับ<br><small>Withdrawal count will not be incremented</small></li>'
                  + '<li>ข้อมูลการเป็นสมาชิกจะถูกคืน<br><small>Your membership will be restored</small></li>';
    }
    document.getElementById('cancelTxTypeLabel').textContent = typeLabel;
    document.getElementById('cancelTxReassurance').innerHTML = reassurance;

    const confirmBtn = document.getElementById('confirmCancelTxBtn');
    confirmBtn.disabled = false;
    confirmBtn.removeAttribute('aria-busy');
    confirmBtn.innerHTML = 'ยืนยันการยกเลิก / Confirm Cancel';

    document.getElementById('cancelTxModal').showModal();
  }

  function closeCancelTx() { document.getElementById('cancelTxModal').close(); }

  function confirmCancelTx() {
    const txId = document.getElementById('cancelTxId').value;
    if (!txId) { closeCancelTx(); return; }

    const confirmBtn = document.getElementById('confirmCancelTxBtn');
    const errorBox = document.getElementById('cancelTxError');
    confirmBtn.disabled = true;
    confirmBtn.setAttribute('aria-busy', 'true');
    confirmBtn.innerHTML = 'กำลังยกเลิก... / Cancelling...';
    errorBox.style.display = 'none';

    const deviceInfo = (navigator.userAgent || '') + ' | ' + screen.width + 'x' + screen.height;

    google.script.run
      .withSuccessHandler((response) => {
        if (response && response.success) {
          closeCancelTx();
          showSuccessToast(response.msg || 'ยกเลิกรายการสำเร็จ / Transaction cancelled.');
        } else {
          confirmBtn.disabled = false;
          confirmBtn.removeAttribute('aria-busy');
          confirmBtn.innerHTML = 'ยืนยันการยกเลิก / Confirm Cancel';
          errorBox.textContent = (response && response.msg) ? response.msg : 'ไม่สามารถยกเลิกได้ / Unable to cancel.';
          errorBox.style.display = 'block';
        }
      })
      .withFailureHandler((err) => {
        confirmBtn.disabled = false;
        confirmBtn.removeAttribute('aria-busy');
        confirmBtn.innerHTML = 'ยืนยันการยกเลิก / Confirm Cancel';
        errorBox.textContent = 'System Error: ' + err;
        errorBox.style.display = 'block';
      })
      .cancelTransaction(txId, deviceInfo);
  }

  function buildWithdrawalTimeline(wdDate, todayBangkok, isPreview) {
    if (!wdDate) return '';

    const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const y = wdDate.getFullYear();
    const m = wdDate.getMonth();
    const day = wdDate.getDate();
    const dmy = (dd, mm, yy) => dd + ' ' + MONTHS_EN[mm] + ' ' + yy;
    const lastOf = (mm, yy) => new Date(yy, mm + 1, 0).getDate();
    const next = (mm, yy) => (mm + 1 > 11 ? [0, yy + 1] : [mm + 1, yy]);
    const utc = (yy, mm, dd) => Date.UTC(yy, mm, dd);

    const tb = (todayBangkok || '').split('-').map(Number);
    let todayNum;
    if (tb.length === 3 && tb[0] && tb[1]) {
      todayNum = utc(tb[0], tb[1] - 1, tb[2]);
    } else {
      const n = new Date();
      todayNum = utc(n.getFullYear(), n.getMonth(), n.getDate());
    }

    const steps = [];
    steps.push({ dateLabel: dmy(day, m, y), th: 'ยื่นคำขอลาออก', en: 'Withdrawal Submission', to: utc(y, m, day) });

    if (day <= 15) {
      steps.push({ dateLabel: dmy(15, m, y), th: 'วันตัดรอบ', en: 'Cut-Off Period', to: utc(y, m, 15) });
      steps.push({ dateLabel: dmy(lastOf(m, y), m, y), th: 'หักเงินงวดสุดท้าย', en: 'Last Deduction', to: utc(y, m, lastOf(m, y)) });
      const [pm, py] = next(m, y);
      steps.push({ dateLabel: '1–' + lastOf(pm, py) + ' ' + MONTHS_EN[pm] + ' ' + py, th: 'อยู่ระหว่างดำเนินการ', en: 'Processing', to: utc(py, pm, lastOf(pm, py)) });
      const [rm, ry] = next(pm, py);
      steps.push({ dateLabel: '1–7 ' + MONTHS_EN[rm] + ' ' + ry, th: 'คาดว่าได้รับเงิน', en: 'Expected Payout', to: utc(ry, rm, 7) });
    } else {
      steps.push({ dateLabel: dmy(lastOf(m, y), m, y), th: 'หักเงินตามปกติ', en: 'Normal Deduction', to: utc(y, m, lastOf(m, y)) });
      const [cm, cy] = next(m, y);
      steps.push({ dateLabel: dmy(15, cm, cy), th: 'วันตัดรอบ', en: 'Cut-Off Period', to: utc(cy, cm, 15) });
      steps.push({ dateLabel: dmy(lastOf(cm, cy), cm, cy), th: 'หักเงินงวดสุดท้าย', en: 'Last Deduction', to: utc(cy, cm, lastOf(cm, cy)) });
      const [pm, py] = next(cm, cy);
      steps.push({ dateLabel: '1–' + lastOf(pm, py) + ' ' + MONTHS_EN[pm] + ' ' + py, th: 'อยู่ระหว่างดำเนินการ', en: 'Processing', to: utc(py, pm, lastOf(pm, py)) });
      const [rm, ry] = next(pm, py);
      steps.push({ dateLabel: '1–7 ' + MONTHS_EN[rm] + ' ' + ry, th: 'คาดว่าได้รับเงิน', en: 'Expected Payout', to: utc(ry, rm, 7) });
    }

    let activeSeen = false;
    const rows = steps.map((s) => {
      let status;
      if (todayNum > s.to) { status = 'is-done'; }
      else if (!activeSeen) { status = 'is-active'; activeSeen = true; }
      else { status = 'is-upcoming'; }
      return '<div class="wd-step ' + status + '">' +
        '<div class="wd-rail"><div class="wd-dot"></div><div class="wd-line"></div></div>' +
        '<div class="wd-body"><strong>' + s.dateLabel + '</strong><div>' + s.th + ' / ' + s.en + '</div></div>' +
        '</div>';
    });

    return '<div class="wd-tracker' + (isPreview ? ' wd-tracker--preview' : '') + '">' + rows.join('') + '</div>';
  }

  function showWithdrawalMessage(response) {
    const wdDate = response.enrollment.lastWithdrawalDate ? new Date(response.enrollment.lastWithdrawalDate) : null;
    const isLocked = response.enrollment.withdrawalCount >= 3;
    const timelineHtml = buildWithdrawalTimeline(wdDate, response.todayBangkok);

    const footerHtml = isLocked
      ? ''
      : '<span style="color: var(--pico-del-color);">* สามารถสมัครใหม่ได้ในวันที่ / Re-enroll on:<br><strong>' + new Date(response.cooldownEndDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + '</strong></span>';

    const div = document.getElementById('cooldownMessage');
    div.style.color = 'var(--pico-color)';
    div.style.textAlign = 'left';
    div.style.fontSize = '0.85rem';
    div.innerHTML =
      '<strong>การลาออกกำลังดำเนินการ / Withdrawal in progress</strong>' +
      timelineHtml +
      (footerHtml ? '<br>' + footerHtml : '');
    div.style.display = 'block';
  }

</script>
