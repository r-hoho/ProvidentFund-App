<script>
  // ==========================================
  // SHARED SIGNATURE PAD HELPER  (window.PFSignature)
  // ==========================================
  // Thin wrapper over signature_pad (loaded via CDN in Index.html). Used by the
  // enrollment wizard (step 5) and the beneficiary edit view. Exposes a small
  // handle-based API so each flow can own its own pad instance:
  //
  //   const handle = PFSignature.mount(canvasEl, onEnd?);
  //   PFSignature.isEmpty(handle)  -> bool
  //   PFSignature.getDataUrl(handle) -> "data:image/png;base64,..."
  //   PFSignature.clear(handle)
  //   PFSignature.destroy(handle)   // call on overlay close to avoid leaks
  //
  // Notes:
  // - Dark-blue ink (#1e3a8a), 2px stroke, transparent background so only the
  //   ink lands in the PDF (the letter page is white).
  // - Hi-DPI aware: the canvas backing store is scaled to devicePixelRatio so
  //   strokes are crisp on mobile (the primary platform). Resizing clears the
  //   pad (a signature_pad requirement), so we mount fresh per open.
  // - The canvas fills the available height (CSS). getDataUrl() auto-trims the
  //   export to the ink's bounding box, so a small/corner signature exports tight
  //   (no huge empty margin); the letter then scales that crop to fit its box.
  window.PFSignature = (function () {

    function sizeCanvas(handle) {
      const canvas = handle.canvas;
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      handle.pad.clear(); // backing-store resize wipes the drawing
    }

    function mount(canvas, onEnd) {
      if (typeof SignaturePad === "undefined") {
        console.error("signature_pad library not loaded");
        return null;
      }
      const pad = new SignaturePad(canvas, {
        penColor: "#1e3a8a",
        minWidth: 2,
        maxWidth: 2.5,
        backgroundColor: "rgba(0,0,0,0)"
      });
      const handle = { pad: pad, canvas: canvas, onEnd: onEnd || null, resize: null };

      handle.resize = function () { sizeCanvas(handle); };
      sizeCanvas(handle);
      window.addEventListener("resize", handle.resize);

      if (onEnd) pad.addEventListener("endStroke", onEnd);
      return handle;
    }

    function isEmpty(handle) { return !handle || handle.pad.isEmpty(); }

    // Crops the canvas to the ink's bounding box (transparent background) so a
    // small or corner signature doesn't export with a huge empty margin — the
    // letter then scales the tight crop up to fill its box. Scans the alpha
    // channel in DEVICE pixels (the backing store is already devicePixelRatio-
    // scaled). Returns a PNG data URL, or null on no-ink / failure so the caller
    // can fall back to the full-canvas export.
    function trimToInk(canvas) {
      try {
        const w = canvas.width, h = canvas.height;
        if (!w || !h) return null;
        const data = canvas.getContext("2d").getImageData(0, 0, w, h).data;

        let minX = w, minY = h, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (data[(y * w + x) * 4 + 3] > 0) { // non-transparent pixel = ink
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) return null; // no ink found

        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const pad = Math.round(8 * ratio); // breathing room so 2px strokes aren't clipped
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(w - 1, maxX + pad);
        maxY = Math.min(h - 1, maxY + pad);

        const cw = maxX - minX + 1, ch = maxY - minY + 1;
        const out = document.createElement("canvas");
        out.width = cw;
        out.height = ch;
        out.getContext("2d").drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
        return out.toDataURL("image/png");
      } catch (e) {
        return null; // fall back to full-canvas export
      }
    }

    function getDataUrl(handle) {
      if (!handle) return null;
      return trimToInk(handle.canvas) || handle.pad.toDataURL("image/png");
    }
    function clear(handle) { if (handle) handle.pad.clear(); }

    function destroy(handle) {
      if (!handle) return;
      try {
        if (handle.onEnd) handle.pad.removeEventListener("endStroke", handle.onEnd);
        handle.pad.off();
        window.removeEventListener("resize", handle.resize);
      } catch (e) { /* best-effort cleanup */ }
    }

    return { mount: mount, isEmpty: isEmpty, getDataUrl: getDataUrl, clear: clear, destroy: destroy };
  })();
</script>
