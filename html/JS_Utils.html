<script>
  // ==========================================
  // SHARED UTILITIES
  // ==========================================

  // Returns cut-off status and the payroll month the action first applies to.
  // on/before 15th → this month's payroll; 16th+ → next month's payroll.
  // Framed as a salary month (not a month-end date) so users don't read it as a
  // literal money-movement day. Mirrors the backend getEffectiveDate() cut-off rule.
  function getEffectiveDateInfo() {
    const today = new Date();
    const withinCutoff = today.getDate() <= 15;
    let year  = today.getFullYear();
    let month = today.getMonth(); // 0-indexed

    if (!withinCutoff) {
      month += 1;
      if (month > 11) { month = 0; year += 1; }
    }

    const thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                        'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const engMonths  = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];

    return {
      withinCutoff,
      monthTH: `${thaiMonths[month]} ${year}`,
      monthEN: `${engMonths[month]} ${year}`
    };
  }

  // Returns an HTML string for the effective date notice banner.
  // context 'withdraw' flips the copy to the LAST contribution month (a withdrawal
  // is deducted one final time that cycle); enroll/plan-change use the FIRST month.
  function effectiveDateBannerHTML(context) {
    const info = getEffectiveDateInfo();
    const statusTH = info.withinCutoff ? 'อยู่ในรอบตัดของเดือนนี้' : 'เลยรอบตัดของเดือนนี้แล้ว';
    const statusEN = info.withinCutoff ? "Within this month's cut-off" : "Past this month's cut-off";
    const isWithdraw = context === 'withdraw';
    const labelTH = isWithdraw ? 'หักเงินสมทบครั้งสุดท้าย:' : 'เริ่มหัก/มีผลกับเงินเดือนรอบ:';
    const labelEN = isWithdraw ? 'Final contribution deducted:' : 'First applies to payroll for:';
    return `
      <div style="margin-top:1rem; padding:0.75rem 1rem; border-radius:var(--pico-border-radius); background:#f8fafc; border:1px solid #cbd5e1; font-size:0.85rem; color:#475569;">
        <strong>${statusTH}</strong><br>
        ${statusEN}<br><br>
        ${labelTH}<br>
        ${labelEN}<br>
        <strong style="color:#1e293b; font-size:0.95rem;">${info.monthTH} / ${info.monthEN}</strong>
      </div>`;
  }

  // Beneficiary relationship display labels (Thai primary, English in brackets).
  // The stored rel value stays the English key (the <select> option value); only
  // display is mapped. Mirror of REL_LABELS in Code/Config.gs — keep in sync.
  const REL_LABELS = {
    'Parent':   'บิดา/มารดา (Parent)',
    'Spouse':   'คู่สมรส (Spouse)',
    'Child':    'บุตร (Child)',
    'Relative': 'ญาติ (Relative)',
    'Friend':   'เพื่อน (Friend)',
    'Other':    'อื่นๆ (Other)'
  };

  // Maps a stored relationship key to its Thai-first label. Unknown/blank keys
  // pass through unchanged.
  function relLabel(rel) {
    return rel ? (REL_LABELS[rel] || rel) : rel;
  }
</script>
